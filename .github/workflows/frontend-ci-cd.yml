name: Frontend CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "Client/**"

env:
  AWS_REGION: eu-west-1
  BUILD_DIR: Client/build

jobs:

  build:
    name: Build React App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: Client/package-lock.json  # ✅ Fix 4

      - name: Install dependencies
        run: npm ci

      - name: Run npm security audit
        run: npm audit --audit-level=high --omit=dev  # ✅ Fix 5

      - name: Build React app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ${{ env.BUILD_DIR }}  # ✅ Fix 1

  deploy:
    name: Deploy to S3 + CloudFront
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ${{ env.BUILD_DIR }}  # ✅ Fix 2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync build to S3
        run: |
          aws s3 sync ${{ env.BUILD_DIR }} s3://${{ vars.S3_BUCKET_NAME }} \  # ✅ Fix 3
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \  # ✅ Fix 3
            --paths "/*"

      - name: Deployment notification
        run: |
          echo "✅ Frontend deployed successfully"
          echo "S3 Bucket: ${{ vars.S3_BUCKET_NAME }}"
          echo "CloudFront ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"