name: Backend CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "server/**"

env:
  AWS_REGION: eu-west-1
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # -----------------------------
  # 1. TEST GO APPLICATION
  # -----------------------------
  test:
    name: Test & Build Go App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download dependencies
        run: go mod tidy

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: go build -o app

  docker:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t backend:${IMAGE_TAG} ./server

      - name: Tag image for ECR
        run: |
          docker tag backend:${IMAGE_TAG} $ECR_URL:${IMAGE_TAG}

      - name: Push image to ECR
        run: |
          docker push $ECR_URL:${IMAGE_TAG}

  deploy:
    name: Deploy via Terraform Outputs (Rolling Update)
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------
      # Download Terraform outputs
      # -----------------------------
      - name: Download Terraform outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-outputs

      # -----------------------------
      # Extract values from Terraform
      # -----------------------------
      - name: Parse Terraform outputs
        run: |
          sudo apt-get update && sudo apt-get install -y jq

          echo "ECR_URL=$(jq -r '.ecr_url.value' outputs.json)" >> $GITHUB_ENV
          echo "ASG_NAME=$(jq -r '.asg_name.value' outputs.json)" >> $GITHUB_ENV

      # -----------------------------
      # AWS authentication
      # -----------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------
      # Trigger rolling deployment
      # -----------------------------
      - name: Start ASG Instance Refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{
              "MinHealthyPercentage": 75,
              "InstanceWarmup": 60
            }'

      - name: Deployment Status
        run: |
          echo "Deployment triggered successfully"
          echo "ASG: $ASG_NAME"
          echo "ECR: $ECR_URL"