name: Backend CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "Server/**"

env:
  AWS_REGION: eu-west-1
  IMAGE_TAG: ${{ github.sha }}
  ECR_REPOSITORY: backend

jobs:

# =============================
# 1. TEST STAGE
# =============================
  test:
    name: Test, Lint & Security Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download dependencies
        run: go mod tidy

      # Unit + Integration tests
      - name: Run tests
        run: go test ./...

      # Code quality checks
      - name: Go Vet (Static Analysis)
        run: go vet ./...

      # Vulnerability scanning (code)
      - name: Install Gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run Security Scan (Gosec)
        run: gosec ./...


# =============================
# 2. BUILD & PUSH STAGE
# =============================
  docker:
    name: Build, Scan & Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR URI
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ECR_URL=$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t $ECR_URL:${IMAGE_TAG} ./backend

      # Docker vulnerability scan
      - name: Scan Docker Image (Trivy)
        run: |
          docker run --rm aquasec/trivy image $ECR_URL:${IMAGE_TAG}

      - name: Push Docker image to ECR
        run: docker push $ECR_URL:${IMAGE_TAG}


# =============================
# 3. DEPLOY STAGE
# =============================
  deploy:
    name: Rolling Deployment (ASG + Smoke Tests)
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # AWS auth
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Get ASG name (from Terraform outputs artifact)
      - name: Download Terraform outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-outputs

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Parse Terraform outputs
        run: |
          echo "ASG_NAME=$(jq -r '.asg_name.value' outputs.json)" >> $GITHUB_ENV

      # Rolling deployment
      - name: Start ASG Instance Refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{
              "MinHealthyPercentage": 75,
              "InstanceWarmup": 60
            }'

      # Smoke tests
      - name: Wait for deployment stabilization
        run: sleep 60

      - name: Run Smoke Tests
        run: |
          curl -f http://your-alb-url/health || exit 1

      # Deployment confirmation
      - name: Deployment Status
        run: |
          echo "✅ Backend deployment completed successfully"
          echo "ASG: $ASG_NAME"
          echo "Image: $ECR_URL:${IMAGE_TAG}"
    on:
  workflow_dispatch: